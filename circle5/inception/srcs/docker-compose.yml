version: "3.9"

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_user_password
      - db_root_password
      - db_admin_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_user_password
      - wp_admin_password
      - wp_admin_email
      - wp_user_password
      - wp_user_email
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception
    restart: always

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    restart: always

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception
    restart: always

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    env_file:
      - .env
    secrets:
      - ftp_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    restart: always

  static_site:
    build: ./requirements/bonus/static_site
    container_name: static_site
    networks:
      - inception
    restart: always

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    networks:
      - inception
    restart: always

  portainer:
    build: ./requirements/bonus/portainer
    container_name: portainer
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inception
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aputri-a/data/mariadb

  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aputri-a/data/wordpress
  
  portainer_data:
    name: portainer_data

secrets:
  db_user_password:
    file: ../secrets/database/db_user_password.txt
  db_root_password:
    file: ../secrets/database/db_root_password.txt
  db_admin_password:
    file: ../secrets/database/db_admin_password.txt
  wp_admin_password:
    file: ../secrets/wordpress/wp_admin_password.txt
  wp_admin_email:
    file: ../secrets/wordpress/wp_admin_email.txt
  wp_user_password:
    file: ../secrets/wordpress/wp_user_password.txt
  wp_user_email:
    file: ../secrets/wordpress/wp_user_email.txt
  ftp_password:
    file: ../secrets/ftp/ftp_password.txt
