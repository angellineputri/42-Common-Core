<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Simon Says!</h1>
    <p>Repeat the sequence!</p>
  </header>

  <main>
    <div id="game">
      <div class="color-button" id="red"></div>
      <div class="color-button" id="blue"></div>
      <div class="color-button" id="green"></div>
      <div class="color-button" id="yellow"></div>
    </div>
    <p id="level">Level: 0</p>
    <button id="start">Start Game</button>
  </main>

  <footer>
    <p>&copy; inception project - aputri-a</p>
  </footer>

  <script src="js/simon.js"></script>
</body>
</html>
